<svg xmlns="http://www.w3.org/2000/svg" width="560" height="214" viewBox="0 0 560 214" role="img" aria-label="Voice control. Talk to it on the calendar, meals, chores and shopping screens. OCR document scanning. Point the camera at a flyer and add its events to the calendar. AI assistant. Fia, a chat assistant powered by Claude, can change the calendar, shopping list and meal plan."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="275.0" height="102" rx="10"/></clipPath><rect width="275.0" height="102" rx="10" fill="url(#n)"/><rect width="275.0" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="274.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">Voice control</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Talk to it on the calendar, meals,</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">chores and shopping screens.</text></g><g transform="translate(285.0,0)"><clipPath id="c0_1"><rect width="275.0" height="102" rx="10"/></clipPath><rect width="275.0" height="102" rx="10" fill="url(#n)"/><rect width="275.0" height="4" fill="#2f7f7a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="274.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">OCR document scanning</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Point the camera at a flyer and</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">add its events to the calendar.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="560.0" height="102" rx="10"/></clipPath><rect width="560.0" height="102" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#2f7f7a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">AI assistant</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Fia, a chat assistant powered by Claude, can change the calendar,</text><text x="282" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">shopping list and meal plan.</text></g></g></svg>
