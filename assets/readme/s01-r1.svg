<svg xmlns="http://www.w3.org/2000/svg" width="820" height="157" viewBox="0 0 820 157" role="img" aria-label="Voice control. Talk to it on the calendar, meals, chores and shopping screens. OCR document scanning. Point the camera at a flyer and add its events to the calendar. AI assistant. Fia, a chat assistant powered by Claude, can change the calendar, shopping list and meal plan."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="232.3" height="157" rx="10"/></clipPath><rect width="232.3" height="157" rx="10" fill="url(#n)"/><rect width="232.3" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="231.3" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="118" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">Voice control</text><text x="118" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Talk to it on the</text><text x="118" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">calendar, meals, chores</text><text x="118" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">and shopping screens.</text></g><g transform="translate(244.3,0)"><clipPath id="c0_1"><rect width="273.1" height="157" rx="10"/></clipPath><rect width="273.1" height="157" rx="10" fill="url(#n)"/><rect width="273.1" height="4" fill="#2f7f7a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="272.1" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="139" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">OCR document</text><text x="139" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#c4dbd9">scanning</text><text x="139" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Point the camera at a flyer</text><text x="139" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">and add its events to the</text><text x="139" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">calendar.</text></g><g transform="translate(529.4,0)"><clipPath id="c0_2"><rect width="290.6" height="157" rx="10"/></clipPath><rect width="290.6" height="157" rx="10" fill="url(#n)"/><rect width="290.6" height="4" fill="#2f7f7a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="289.6" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="147" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">AI assistant</text><text x="147" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Fia, a chat assistant powered</text><text x="147" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">by Claude, can change the</text><text x="147" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">calendar, shopping list and meal</text><text x="147" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">plan.</text></g></g></svg>
