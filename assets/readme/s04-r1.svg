<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Python 3 with a venv. Install the anthropic and openai packages for the AI features. Two API keys. OpenAI for Whisper voice, Anthropic for OCR and Fia chat. Runs on port 8766. Open localhost:8766, or install it as a PWA from Safari."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="265.3" height="133" rx="10"/></clipPath><rect width="265.3" height="133" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="264.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">Python 3 with a venv</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Install the anthropic and</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">openai packages for the AI</text><text x="135" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">features.</text></g><g transform="translate(277.3,0)"><clipPath id="c0_1"><rect width="265.3" height="133" rx="10"/></clipPath><rect width="265.3" height="133" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#4f7a4a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="264.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">Two API keys</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">OpenAI for Whisper voice,</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Anthropic for OCR and Fia</text><text x="135" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">chat.</text></g><g transform="translate(554.7,0)"><clipPath id="c0_2"><rect width="265.3" height="133" rx="10"/></clipPath><rect width="265.3" height="133" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#4f7a4a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="264.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">Runs on port 8766</text><text x="135" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Open localhost:8766, or</text><text x="135" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">install it as a PWA from</text><text x="135" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">Safari.</text></g></g></svg>
